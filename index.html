<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta-Tags -->
  <title>APRS Live-Ticker – Realtime Datenfluss</title>
  <meta name="description" content="Echtzeit-Laufband des APRS-Datenflusses für Amateurfunk und mobile Stationen.">
  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .ticker-wrapper {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background-color: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .ticker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .ticker-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .led-lamp {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #dc2626;
      box-shadow: 0 0 6px #dc2626;
      transition: all 0.3s ease;
    }

    .led-lamp.online {
      background-color: #16a34a;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Laufband-Container */
    .ticker-container {
      position: relative;
      width: 100%;
      height: 60px;
      background: #1e293b;
      overflow: hidden;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: scrollTicker 70s linear infinite;
    }

    /* Bei Mouseover anhalten */
    .ticker-container:hover .ticker-track {
      animation-play-state: paused;
    }

    @keyframes scrollTicker {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 25px;
      font-size: 15px;
      border-right: 1px solid #334155;
    }

    .ticker-time {
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
    }

    /* Klickbares Rufzeichen */
    .ticker-call {
      color: #38bdf8;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
    }

    .ticker-call:hover {
      color: #93c5fd;
    }

    .ticker-coords {
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
    }

    .ticker-comment {
      color: #cbd5e1;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="ticker-wrapper">
  <div class="ticker-header">
    <div class="ticker-title">
      <span>⚡ APRS Live-Datenstrom Ticker</span>
    </div>
    <div class="status-badge">
      <div id="led-indicator" class="led-lamp"></div>
      <span id="status-text">OFFLINE</span>
    </div>
  </div>

  <div class="ticker-container">
    <div id="ticker-track" class="ticker-track">
      <div class="ticker-item">Lade APRS Datenstrom...</div>
    </div>
  </div>
</div>

<script>
  // Gleicher Supabase-Zugang wie die APRS-Karte
  const SUPA_URL = "https://acharyaisxfpmvejmhho.supabase.co";
  const SUPA_ANON = "sb_publishable_-ylVCQEcJiDn41pWdVIRlA_PGekzQI-";

  const HOURS = 1;
  const REFRESH_MS = 60 * 1000;

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function fetchTickerData() {
    const ledIndicator = document.getElementById('led-indicator');
    const statusText = document.getElementById('status-text');
    const track = document.getElementById('ticker-track');

    try {
      const since = new Date(Date.now() - HOURS * 3600e3).toISOString();
      const url = `${SUPA_URL}/rest/v1/aprs_history` +
        `?select=callsign,latitude,longitude,symbol,timestamp` +
        `&timestamp=gte.${encodeURIComponent(since)}` +
        `&order=timestamp.desc` +
        `&limit=50`;

      const res = await fetch(url, {
        headers: { apikey: SUPA_ANON, Authorization: `Bearer ${SUPA_ANON}` }
      });
      if (!res.ok) throw new Error("HTTP Fehler " + res.status);
      const data = await res.json();

      ledIndicator.classList.add('online');
      statusText.innerText = "ONLINE";

      if (!Array.isArray(data) || data.length === 0) {
        track.innerHTML = `<div class="ticker-item">Keine aktuellen Baken in der letzten Stunde empfangen.</div>`;
        return;
      }

      let htmlContent = "";
      // Doppelt ausgeben, damit das Laufband nahtlos läuft
      for (let i = 0; i < 2; i++) {
        data.forEach(item => {
          const timeStr = item.timestamp
            ? new Date(item.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            : '';
          const symbolStr = item.symbol ? `[${escapeHtml(item.symbol)}]` : '';
          const call = escapeHtml(item.callsign);
          const cleanCall = encodeURIComponent((item.callsign || '').split('-')[0].trim());
          const qrzUrl = `https://www.qrz.com/db/${cleanCall}`;

          htmlContent += `
            <div class="ticker-item">
              <span class="ticker-time">[${timeStr}]</span>
              <span class="ticker-call" onclick="window.open('${qrzUrl}', '_blank')" title="Auf QRZ.com öffnen">${call}</span>
              <span class="ticker-coords">(${Number(item.latitude).toFixed(4)}, ${Number(item.longitude).toFixed(4)})</span>
              <span class="ticker-comment">${symbolStr}</span>
            </div>`;
        });
      }

      track.innerHTML = htmlContent;

    } catch (error) {
      console.error("Fehler beim Ticker-Abruf:", error);
      ledIndicator.classList.remove('online');
      statusText.innerText = "OFFLINE";
    }
  }

  fetchTickerData();
  setInterval(fetchTickerData, REFRESH_MS);
</script>

</body>
</html>
